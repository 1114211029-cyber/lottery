<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抽籤小程式</title>
    <style>
      :root {
        --bg: #f5f7ff;
        --panel: #ffffff;
        --primary: #5b6cff;
        --primary-dark: #3f4fd8;
        --text: #1f2937;
        --muted: #6b7280;
        --danger: #ef4444;
        --shadow: 0 18px 40px rgba(91, 108, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      .app {
        width: min(92vw, 760px);
        background: var(--panel);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 32px 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 2.6rem);
        text-align: center;
      }

      .subtitle {
        text-align: center;
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .panel {
        margin-bottom: 18px;
      }

      textarea {
        width: 100%;
        min-height: 160px;
        resize: vertical;
        border: 2px solid #dfe6ff;
        border-radius: 16px;
        padding: 16px 18px;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text);
        background: #f9faff;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(91, 108, 255, 0.12);
      }

      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 16px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.02);
      }

      button:active {
        transform: translateY(0);
      }

      .primary {
        background: var(--primary);
        color: white;
      }

      .primary:hover {
        background: var(--primary-dark);
      }

      .secondary {
        background: #eef2ff;
        color: var(--primary-dark);
      }

      .result-box {
        margin-top: 28px;
        background: linear-gradient(135deg, #eef2ff, #ffffff);
        border: 1px solid #dfe6ff;
        border-radius: 20px;
        padding: 24px 18px;
        text-align: center;
      }

      .label {
        display: inline-block;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #winner {
        font-size: clamp(2rem, 5vw, 3.2rem);
        font-weight: 900;
        color: var(--primary-dark);
        min-height: 1.4em;
      }

      .status {
        margin-top: 12px;
        color: var(--muted);
        min-height: 1.5em;
      }

      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      @media (max-width: 560px) {
        .app {
          padding: 22px 18px;
        }

        .controls {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>抽籤小程式</h1>
      <p class="subtitle">請輸入參加者，點選「開始抽籤」就能隨機選出幸運者</p>

      <div class="panel">
        <textarea id="names" placeholder="每行一個名字&#10;例如：&#10;小明&#10;小華&#10;美美&#10;阿強"></textarea>
      </div>

      <div class="controls">
        <button class="primary" id="drawBtn">開始抽籤</button>
        <button class="secondary" id="resetBtn">清空名單</button>
      </div>

      <div class="result-box">
        <span class="label">幸運者</span>
        <div id="winner">等待抽籤...</div>
        <div class="status" id="status">目前人數：0</div>
      </div>

      <div class="hint">提示：可直接輸入多個名字，每行一個，支援中英文。</div>
    </div>

    <script>
      const namesInput = document.getElementById('names');
      const drawBtn = document.getElementById('drawBtn');
      const resetBtn = document.getElementById('resetBtn');
      const winnerEl = document.getElementById('winner');
      const statusEl = document.getElementById('status');

      function parseNames() {
        return namesInput.value
          .split(/\n|,|；|，/)
          .map((name) => name.trim())
          .filter((name) => name.length > 0);
      }

      function updateStatus(count) {
        statusEl.textContent = `目前人數：${count}`;
      }

      function setDefaultNames() {
        namesInput.value = '小明\n小華\n美美\n阿強\n小文\n大雄\n琪琪\n忠孝';
        updateStatus(parseNames().length);
      }

      function drawWinner() {
        const list = parseNames();

        if (list.length === 0) {
          winnerEl.textContent = '請先輸入名單';
          statusEl.textContent = '目前人數：0';
          return;
        }

        if (list.length === 1) {
          winnerEl.textContent = list[0];
          statusEl.textContent = '目前人數：1';
          return;
        }

        const animationSteps = 18;
        const randomizeDuration = 120;
        let step = 0;

        const timer = setInterval(() => {
          const randomName = list[Math.floor(Math.random() * list.length)];
          winnerEl.textContent = randomName;
          step += 1;

          if (step >= animationSteps) {
            clearInterval(timer);
            const finalWinner = list[Math.floor(Math.random() * list.length)];
            winnerEl.textContent = finalWinner;
            statusEl.textContent = `抽中：${finalWinner} ； 目前人數：${list.length}`;
          }
        }, randomizeDuration);
      }

      drawBtn.addEventListener('click', drawWinner);
      resetBtn.addEventListener('click', () => {
        namesInput.value = '';
        winnerEl.textContent = '等待抽籤...';
        updateStatus(0);
      });

      namesInput.addEventListener('input', () => {
        updateStatus(parseNames().length);
      });

      setDefaultNames();
    </script>
  </body>
</html>
